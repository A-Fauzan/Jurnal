<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Jurnal Kerja</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.js"></script>
<script>tailwind.config={theme:{extend:{fontFamily:{serif:['DM Serif Display','serif'],sans:['DM Sans','sans-serif']},keyframes:{fadeUp:{from:{opacity:0,transform:'translateY(10px)'},to:{opacity:1,transform:'translateY(0)'}}},animation:{'fade-up':'fadeUp .25s ease both'}}}}</script>
<style>
html,body{height:100%;overflow:hidden;background:#f8fafc;font-family:'DM Sans',sans-serif}
#app{max-width:480px;margin:0 auto;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.page{position:absolute;inset:0;overflow-y:auto;padding:16px 16px 88px;display:none}
.page.active{display:block}
::-webkit-scrollbar{width:2px}::-webkit-scrollbar-thumb{background:#e2e8f0;border-radius:99px}
input:focus,select:focus,textarea:focus{outline:none}
@keyframes spin{to{transform:rotate(360deg)}}.spinner{animation:spin .7s linear infinite}
</style>
</head>
<body>
<div id="app">
  <!-- HEADER -->
  <div class="flex-shrink-0 bg-slate-800 px-5 py-3.5 relative overflow-hidden">
    <div class="absolute -top-4 -right-4 w-20 h-20 rounded-full bg-white/5"></div>
    <div class="flex items-center justify-between relative">
      <div>
        <div class="font-serif text-white text-lg">Jurnal Kerja</div>
        <div class="text-slate-400 text-xs mt-0.5 flex items-center gap-1">
          <i data-lucide="building-2" class="w-3 h-3"></i> BIG — Fauzan
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="prevMonth()" class="text-slate-500 hover:text-white p-1.5 rounded-lg hover:bg-white/5 transition-colors"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
        <span id="h-month" class="text-white text-sm font-medium min-w-[90px] text-center">— —</span>
        <button onclick="nextMonth()" class="text-slate-500 hover:text-white p-1.5 rounded-lg hover:bg-white/5 transition-colors"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
      </div>
    </div>
  </div>

  <div id="pages" class="flex-1 overflow-hidden relative">

    <!-- HOME -->
    <div class="page active" id="page-home">
      <!-- Summary Cards -->
      <div class="grid grid-cols-3 gap-2 mb-5">
        <div class="bg-white rounded-xl p-3 text-center border border-slate-100">
          <div class="text-blue-500 flex justify-center mb-1"><i data-lucide="clock" class="w-4 h-4"></i></div>
          <div id="stat-jam" class="font-bold text-stone-800 text-base">0</div>
          <div class="text-stone-400 text-xs">Jam Kerja</div>
        </div>
        <div class="bg-white rounded-xl p-3 text-center border border-slate-100">
          <div class="text-indigo-500 flex justify-center mb-1"><i data-lucide="list-checks" class="w-4 h-4"></i></div>
          <div id="stat-kegiatan" class="font-bold text-stone-800 text-base">0</div>
          <div class="text-stone-400 text-xs">Kegiatan</div>
        </div>
        <div class="bg-white rounded-xl p-3 text-center border border-slate-100">
          <div class="text-emerald-500 flex justify-center mb-1"><i data-lucide="calendar-days" class="w-4 h-4"></i></div>
          <div id="stat-hari" class="font-bold text-stone-800 text-base">0</div>
          <div class="text-stone-400 text-xs">Hari Aktif</div>
        </div>
      </div>

      <!-- Chart Jam per Kategori -->
      <div class="bg-white rounded-2xl border border-slate-100 p-4 mb-4">
        <div class="text-sm font-semibold text-stone-700 mb-3">Distribusi Jam per Kategori</div>
        <div id="chart-empty" class="hidden py-6 flex flex-col items-center text-stone-300"><i data-lucide="bar-chart-2" class="w-8 h-8 mb-2"></i><span class="text-sm">Belum ada data</span></div>
        <canvas id="chart-kat" height="160"></canvas>
        <div id="chart-legend" class="mt-3 space-y-1.5"></div>
      </div>

      <!-- Recent -->
      <div class="flex items-center justify-between mb-3">
        <div class="font-serif text-stone-800">Kegiatan Terbaru</div>
        <span id="log-count" class="text-xs text-stone-400"></span>
      </div>
      <div id="log-list"><div class="flex flex-col items-center py-8 text-stone-300"><div class="w-6 h-6 border-2 border-stone-200 border-t-blue-400 rounded-full spinner mb-2"></div><span class="text-sm">Memuat...</span></div></div>
    </div>

    <!-- TAMBAH -->
    <div class="page" id="page-add">
      <div class="font-serif text-stone-800 text-xl mb-5">Catat Kegiatan</div>
      <div id="add-toast" class="hidden rounded-xl px-4 py-3 mb-4 text-sm font-semibold text-white text-center"></div>

      <div class="space-y-4">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs font-semibold text-stone-400 tracking-widest block mb-1.5">TANGGAL</label>
            <input type="date" id="inp-tanggal" class="w-full bg-white border-2 border-stone-200 focus:border-blue-400 rounded-xl px-4 py-3 text-sm text-stone-700 transition-colors"/>
          </div>
          <div>
            <label class="text-xs font-semibold text-stone-400 tracking-widest block mb-1.5">DURASI (JAM)</label>
            <input type="number" step="0.5" id="inp-durasi" placeholder="2" class="w-full bg-white border-2 border-stone-200 focus:border-blue-400 rounded-xl px-4 py-3 text-sm text-stone-700 transition-colors"/>
          </div>
        </div>
        <div>
          <label class="text-xs font-semibold text-stone-400 tracking-widest block mb-1.5">KATEGORI</label>
          <div id="kat-grid" class="grid grid-cols-4 gap-2"></div>
        </div>
        <div>
          <label class="text-xs font-semibold text-stone-400 tracking-widest block mb-1.5">KEGIATAN</label>
          <input type="text" id="inp-kegiatan" placeholder="Misal: Digitasi batas wilayah Kabupaten X..." class="w-full bg-white border-2 border-stone-200 focus:border-blue-400 rounded-xl px-4 py-3 text-sm text-stone-700 transition-colors"/>
        </div>
        <div>
          <label class="text-xs font-semibold text-stone-400 tracking-widest block mb-1.5">OUTPUT / HASIL</label>
          <input type="text" id="inp-output" placeholder="Misal: Shapefile 3 kecamatan selesai" class="w-full bg-white border-2 border-stone-200 focus:border-blue-400 rounded-xl px-4 py-3 text-sm text-stone-700 transition-colors"/>
        </div>
        <div>
          <label class="text-xs font-semibold text-stone-400 tracking-widest block mb-1.5">CATATAN</label>
          <textarea id="inp-catatan" rows="2" placeholder="Kendala, next step, dll..." class="w-full bg-white border-2 border-stone-200 focus:border-blue-400 rounded-xl px-4 py-3 text-sm text-stone-700 resize-none transition-colors"></textarea>
        </div>
      </div>
      <button onclick="simpan()" class="mt-5 w-full flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-700 active:scale-95 text-white rounded-xl py-4 text-base font-semibold transition-all">
        <i data-lucide="save" class="w-5 h-5"></i> Simpan Kegiatan
      </button>
    </div>

    <!-- RIWAYAT -->
    <div class="page" id="page-history">
      <div class="font-serif text-stone-800 text-xl mb-4">Riwayat</div>
      <div class="relative mb-4">
        <div class="absolute left-3.5 top-1/2 -translate-y-1/2 text-stone-400"><i data-lucide="search" class="w-4 h-4"></i></div>
        <input type="text" id="search-input" placeholder="Cari kegiatan..." oninput="renderHistory()"
          class="w-full bg-white border border-stone-200 focus:border-blue-400 rounded-xl pl-10 pr-4 py-3 text-sm text-stone-700 transition-colors"/>
      </div>
      <div id="history-list"></div>
    </div>
  </div>

  <!-- TAB BAR -->
  <div class="flex-shrink-0 bg-white/95 backdrop-blur border-t border-stone-100 flex" style="padding-bottom:env(safe-area-inset-bottom,0px)">
    <button onclick="showTab('home')" class="tab-btn flex-1 flex flex-col items-center gap-1 py-3">
      <i data-lucide="layout-dashboard" class="w-5 h-5 text-stone-400 tab-icon"></i>
      <span class="text-[10px] font-semibold text-stone-400 tab-label">Dashboard</span>
    </button>
    <button onclick="showTab('add')" class="tab-btn flex-1 flex flex-col items-center gap-1 py-3">
      <div class="w-9 h-9 -mt-6 rounded-full bg-slate-800 flex items-center justify-center shadow-lg">
        <i data-lucide="plus" class="w-5 h-5 text-white"></i>
      </div>
      <span class="text-[10px] font-semibold text-stone-400 tab-label">Catat</span>
    </button>
    <button onclick="showTab('history')" class="tab-btn flex-1 flex flex-col items-center gap-1 py-3">
      <i data-lucide="list" class="w-5 h-5 text-stone-400 tab-icon"></i>
      <span class="text-[10px] font-semibold text-stone-400 tab-label">Riwayat</span>
    </button>
  </div>
</div>
<div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 px-5 py-3 rounded-xl font-semibold text-sm text-white z-50 opacity-0 pointer-events-none transition-opacity whitespace-nowrap shadow-lg"></div>

<script>
const API_URL = "ISI_URL_APPS_SCRIPT_JURNAL";
const API_KEY = "jurnal-fauzan-big-rahasia";

const KATEGORI = ["Pemetaan","Analisis GIS","Administrasi","Rapat","Pengembangan","Pelatihan","Koordinasi","Lainnya"];
const KAT_ICONS = {"Pemetaan":"map","Analisis GIS":"layers","Administrasi":"file-text","Rapat":"users","Pengembangan":"code-2","Pelatihan":"graduation-cap","Koordinasi":"network","Lainnya":"more-horizontal"};
const KAT_COLORS = {"Pemetaan":"#3b82f6","Analisis GIS":"#8b5cf6","Administrasi":"#64748b","Rapat":"#f59e0b","Pengembangan":"#10b981","Pelatihan":"#06b6d4","Koordinasi":"#f43f5e","Lainnya":"#a8a29e"};
const MID=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const MS =['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agt','Sep','Okt','Nov','Des'];

let selMonth = '', curTab='home', curKat='Pemetaan', allData=[], curChart=null;
const tod = ()=>new Date().toISOString().split('T')[0];
const esc = s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const mKey = d=>{const x=new Date(d);return`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}`;};

async function apiCall(p) {
  const qs=new URLSearchParams({...p,key:API_KEY}).toString();
  const res=await fetch(API_URL+'?'+qs,{redirect:'follow'});
  const d=await res.json(); if(d&&d.error)throw new Error(d.error); return d;
}
function ri(){setTimeout(()=>lucide.createIcons(),10);}
function showToast(msg,ok=true){const el=document.getElementById('toast');el.textContent=msg;el.style.background=ok?'#047857':'#be123c';el.style.opacity='1';setTimeout(()=>el.style.opacity='0',2200);}
function showAddToast(msg,ok=true){const el=document.getElementById('add-toast');el.textContent=msg;el.style.background=ok?'#047857':'#be123c';el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),2500);}

function updateMonthLabel(){const[y,m]=selMonth.split('-').map(Number);document.getElementById('h-month').textContent=MID[m-1]+' '+y;}
async function prevMonth(){const[y,m]=selMonth.split('-').map(Number);selMonth=mKey(new Date(y,m-2,1));updateMonthLabel();await loadData();}
async function nextMonth(){const[y,m]=selMonth.split('-').map(Number);selMonth=mKey(new Date(y,m,1));updateMonthLabel();await loadData();}

async function loadData(){
  try{allData=await apiCall({action:'get_jurnal',month:selMonth});}
  catch(e){console.error(e);allData=[];}
  renderHome();if(curTab==='history')renderHistory();
}

function showTab(tab){
  curTab=tab;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+tab).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach((b,i)=>{
    const tabs=['home','add','history'],isActive=tabs[i]===tab;
    const icon=b.querySelector('.tab-icon'),label=b.querySelector('.tab-label');
    if(icon){icon.classList.toggle('text-blue-500',isActive);icon.classList.toggle('text-stone-400',!isActive);}
    if(label){label.classList.toggle('text-blue-500',isActive);label.classList.toggle('text-stone-400',!isActive);}
  });
  if(tab==='history')renderHistory();
}

function renderHome(){
  const byKat={};const days=new Set();
  let totalJam=0,totalKeg=allData.length;
  allData.forEach(r=>{
    totalJam+=r.durasi_jam;days.add(r.tanggal);
    byKat[r.kategori]=(byKat[r.kategori]||0)+r.durasi_jam;
  });
  document.getElementById('stat-jam').textContent=Math.round(totalJam*10)/10;
  document.getElementById('stat-kegiatan').textContent=totalKeg;
  document.getElementById('stat-hari').textContent=days.size;

  const katData=Object.entries(byKat).sort((a,b)=>b[1]-a[1]);
  const chartEl=document.getElementById('chart-kat');
  const emptyEl=document.getElementById('chart-empty');
  const legendEl=document.getElementById('chart-legend');
  if(curChart){curChart.destroy();curChart=null;}
  if(!katData.length){chartEl.style.display='none';emptyEl.classList.remove('hidden');legendEl.innerHTML='';return;}
  chartEl.style.display='block';emptyEl.classList.add('hidden');
  curChart=new Chart(chartEl,{
    type:'doughnut',
    data:{labels:katData.map(d=>d[0]),datasets:[{data:katData.map(d=>d[1]),backgroundColor:katData.map(d=>KAT_COLORS[d[0]]||'#a8a29e'),borderWidth:3,borderColor:'#fff'}]},
    options:{responsive:true,cutout:'62%',plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>` ${ctx.parsed}jam`}}}}
  });
  const tot=katData.reduce((s,d)=>s+d[1],0);
  legendEl.innerHTML=katData.map(([k,v])=>`<div class="flex items-center gap-2">
    <div class="w-2.5 h-2.5 rounded-full flex-shrink-0" style="background:${KAT_COLORS[k]||'#a8a29e'}"></div>
    <div class="flex-1 text-sm text-stone-600">${k}</div>
    <div class="text-sm font-semibold text-stone-700">${v}jam</div>
    <div class="text-xs text-stone-400 w-8 text-right">${Math.round(v/tot*100)}%</div>
  </div>`).join('');

  const list=document.getElementById('log-list');
  if(!allData.length){list.innerHTML=`<div class="flex flex-col items-center py-10 text-stone-300"><i data-lucide="inbox" class="w-10 h-10 mb-3"></i><div class="text-stone-400 text-sm">Belum ada kegiatan bulan ini</div></div>`;ri();return;}
  document.getElementById('log-count').textContent=allData.length+' kegiatan';
  list.innerHTML=allData.slice(0,8).map(r=>logCard(r)).join('');ri();
}

function logCard(r,showDel=false){
  const tgl=new Date(r.tanggal);
  const col=KAT_COLORS[r.kategori]||'#a8a29e';
  const ico=KAT_ICONS[r.kategori]||'more-horizontal';
  return`<div class="bg-white rounded-xl border border-slate-100 px-4 py-3 mb-2">
    <div class="flex items-start gap-3">
      <div class="w-9 h-9 rounded-lg flex items-center justify-center flex-shrink-0" style="background:${col}18">
        <i data-lucide="${ico}" class="w-4 h-4" style="color:${col}"></i>
      </div>
      <div class="flex-1 min-w-0">
        <div class="text-sm font-semibold text-stone-800 leading-tight">${esc(r.kegiatan)}</div>
        <div class="flex items-center gap-2 mt-1">
          <span class="text-xs px-2 py-0.5 rounded-full text-white font-medium" style="background:${col}">${r.kategori}</span>
          <span class="text-xs text-stone-400">${r.durasi_jam}jam · ${tgl.getDate()} ${MS[tgl.getMonth()]}</span>
        </div>
        ${r.output?`<div class="text-xs text-stone-500 mt-1.5 flex items-center gap-1"><i data-lucide="check-circle" class="w-3 h-3 text-emerald-500"></i>${esc(r.output)}</div>`:''}
      </div>
      ${showDel?`<button onclick="hapus(${r.id})" class="text-stone-200 hover:text-rose-400 transition-colors"><i data-lucide="trash-2" class="w-4 h-4"></i></button>`:''}
    </div>
  </div>`;
}

function renderKatGrid(){
  document.getElementById('kat-grid').innerHTML=KATEGORI.map(k=>{
    const sel=curKat===k;const col=KAT_COLORS[k];const ico=KAT_ICONS[k];
    return`<button onclick="selectKat('${k}')" class="p-2.5 rounded-xl text-center border-2 transition-all ${sel?'':'border-stone-100 bg-white'}"
      style="${sel?`border-color:${col};background:${col}18`:''}" >
      <div class="flex justify-center mb-1"><i data-lucide="${ico}" class="w-4 h-4" style="color:${sel?col:'#a8a29e'}"></i></div>
      <div class="text-[10px] font-semibold leading-tight" style="color:${sel?col:'#a8a29e'}">${k}</div>
    </button>`;
  }).join('');ri();
}
function selectKat(k){curKat=k;renderKatGrid();}

async function simpan(){
  const kegiatan=document.getElementById('inp-kegiatan').value.trim();
  if(!kegiatan){showAddToast('Masukkan kegiatan',false);return;}
  try{
    await apiCall({action:'add_jurnal',tanggal:document.getElementById('inp-tanggal').value||tod(),kategori:curKat,kegiatan,durasi_jam:parseFloat(document.getElementById('inp-durasi').value)||1,output:document.getElementById('inp-output').value,catatan:document.getElementById('inp-catatan').value});
    showAddToast('Kegiatan tersimpan');
    ['inp-kegiatan','inp-output','inp-catatan','inp-durasi'].forEach(id=>document.getElementById(id).value='');
    await loadData();
  }catch(e){showAddToast('Gagal: '+e.message,false);}
}

function renderHistory(){
  const q=(document.getElementById('search-input').value||'').toLowerCase();
  const filtered=allData.filter(r=>!q||r.kegiatan?.toLowerCase().includes(q)||r.kategori?.toLowerCase().includes(q));
  const list=document.getElementById('history-list');
  if(!filtered.length){list.innerHTML=`<div class="flex flex-col items-center py-10 text-stone-300"><i data-lucide="folder-open" class="w-10 h-10 mb-3"></i><span class="text-sm text-stone-400">Tidak ada kegiatan</span></div>`;ri();return;}
  list.innerHTML=filtered.map(r=>logCard(r,true)).join('');ri();
}

async function hapus(id){
  if(!confirm('Hapus kegiatan ini?'))return;
  await apiCall({action:'delete_jurnal',id});
  showToast('Kegiatan dihapus');
  await loadData();
}

async function init(){
  selMonth=mKey(new Date());
  document.getElementById('inp-tanggal').value=tod();
  updateMonthLabel();renderKatGrid();lucide.createIcons();
  await loadData();
}
init();
</script>
</body>
</html>
